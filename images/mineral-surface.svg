<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <filter id="mineral" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".014 .025" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .28 0 0 0 0 .30 0 0 0 0 .34 0 0 0 .12 0"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .20 0 0 0 0 .22 0 0 0 0 .26 0 0 0 .07 0"/>
    </filter>
  </defs>
  <rect width="480" height="480" filter="url(#mineral)"/>
  <rect width="480" height="480" filter="url(#grain)"/>
</svg>
